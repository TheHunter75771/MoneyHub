[project]
name = "money-hub"
version = "0.1.0"
description = "Self-hosted personal finance hub: CSV/OFX ingestion, dedup, envelope budgeting, reconciliation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pypdf>=5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
moneyhub = "moneyhub.cli:main"
moneyhub-web = "moneyhub.api:main"

[tool.setuptools.package-data]
moneyhub = ["web/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["moneyhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by alembic; not hand-formatted.
"migrations/versions/*" = ["E501", "I001"]
# FastAPI's Depends-in-default idiom.
"moneyhub/api.py" = ["B008"]
