[project]
name = "money-hub"
version = "0.1.0"
description = "Self-hosted personal finance hub: CSV/OFX ingestion, dedup, envelope budgeting, reconciliation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["moneyhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
